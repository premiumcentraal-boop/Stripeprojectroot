name: Build RootDeck APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
  workflow_dispatch: 

env:
  # Fixes the Node.js 20 deprecation warning by forcing GitHub Actions to use Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          # --no-daemon prevents memory-related crashes on GitHub Actions runners
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK
        run: |
          # Dynamically finds the APK to prevent "file not found" path mismatch errors
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found! The build step may have failed."
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          mv "$APK_PATH" rootdeck-debug.apk

      - name: Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest RootDeck Build
          body: "Automated build from GitHub Actions containing the latest RootDeck APK with Video Injection."
          files: rootdeck-debug.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
