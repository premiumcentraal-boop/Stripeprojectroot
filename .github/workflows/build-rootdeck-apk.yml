name: Build RootDeck APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
  # Allows you to trigger the build manually from the GitHub Actions tab
  workflow_dispatch: 

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create or update the GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          # Grabs the generated APK and renames it to match the React portal config
          mv android/app/build/outputs/apk/debug/app-debug.apk rootdeck-debug.apk

      - name: Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest RootDeck Build
          body: "Automated build from GitHub Actions containing the latest RootDeck APK with Video Injection."
          files: rootdeck-debug.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
