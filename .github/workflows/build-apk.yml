name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for Android project files
        shell: bash
        run: |
          set -e

          echo "Repository files found:"
          find . -maxdepth 4 -type f | sort | sed 's#^./##' | head -200

          if [ ! -f "gradlew" ]; then
            echo "::error::No Gradle wrapper found. This repository currently cannot build an APK. Add a real Android project first, including gradlew, settings.gradle or settings.gradle.kts, build.gradle or build.gradle.kts, and an Android app module."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::warning::No settings.gradle or settings.gradle.kts found at the repository root. The build may fail unless this is an unusual Gradle layout."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle tasks
        run: ./gradlew --no-daemon tasks --all

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK files
        shell: bash
        run: |
          set -e
          mkdir -p apk-output

          mapfile -t apks < <(find . -type f -path "*/build/outputs/apk/debug/*.apk" | sort)

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::Build completed, but no debug APK files were found under */build/outputs/apk/debug/*.apk"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            module_name=$(echo "$apk" | awk -F'/build/outputs/apk/debug/' '{print $1}' | sed 's#^./##; s#/#-#g')
            cp "$apk" "apk-output/${module_name}-$(basename "$apk")"
          done

          echo "APK files ready:"
          ls -lah apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
