name: Build LSPosed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'LSPosed-master/**'
      - '.github/workflows/build-lsposed-apk.yml'

jobs:
  build-lsposed-apk:
    name: Build LSPosed APK artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify LSPosed project exists
        run: |
          test -f LSPosed-master/settings.gradle.kts
          test -f LSPosed-master/build.gradle.kts
          test -f LSPosed-master/gradle/libs.versions.toml
          test -f LSPosed-master/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Make LSPosed Gradle wrapper executable
        run: chmod +x LSPosed-master/gradlew

      - name: Clone LSPosed external native dependencies
        run: |
          set -euxo pipefail
          mkdir -p LSPosed-master/external

          clone_or_update() {
            local url="$1"
            local dir="$2"
            if [ -d "$dir/.git" ]; then
              git -C "$dir" fetch --depth 1 origin
              git -C "$dir" reset --hard FETCH_HEAD
            elif [ -e "$dir" ] && [ "$(find "$dir" -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
              echo "$dir exists and is not an empty git checkout; leaving it untouched"
            else
              rm -rf "$dir"
              git clone --depth 1 --recursive "$url" "$dir"
            fi
          }

          clone_or_update https://github.com/LSPosed/LSPlant.git LSPosed-master/external/lsplant
          clone_or_update https://github.com/LSPosed/Dobby.git LSPosed-master/external/dobby
          clone_or_update https://github.com/fmtlib/fmt.git LSPosed-master/external/fmt
          clone_or_update https://github.com/topjohnwu/libcxx.git LSPosed-master/external/cxx

      - name: Publish libxposed dependencies to Maven local
        run: |
          set -euxo pipefail
          mkdir -p /tmp/libxposed

          clone_and_publish() {
            local name="$1"
            local url="$2"
            local dir="/tmp/libxposed/$name"
            git clone --depth 1 --branch 100 "$url" "$dir"
            chmod +x "$dir/gradlew"
            (cd "$dir" && ./gradlew publishToMavenLocal --no-daemon --stacktrace)
          }

          clone_and_publish api https://github.com/libxposed/api.git
          clone_and_publish service https://github.com/libxposed/service.git

      - name: Inspect LSPosed Gradle project
        working-directory: LSPosed-master
        run: ./gradlew projects --no-daemon --stacktrace

      - name: Build LSPosed debug APK
        working-directory: LSPosed-master
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Try building LSPosed zip outputs
        id: zipall
        continue-on-error: true
        working-directory: LSPosed-master
        run: ./gradlew zipAll --no-daemon --stacktrace

      - name: Prepare LSPosed release APK
        run: |
          set -euxo pipefail
          mkdir -p ci-artifacts/lsposed-release ci-artifacts/lsposed-zips
          apk_path="$(find LSPosed-master/app/build/outputs/apk -type f -name '*.apk' | sort | head -n 1)"
          test -n "$apk_path"
          cp "$apk_path" ci-artifacts/lsposed-release/lsposed-debug.apk
          find LSPosed-master -type f \( -name '*.zip' -o -name '*LSPosed*.zip' \) -path '*/build/*' -print -exec cp {} ci-artifacts/lsposed-zips/ \; 2>/dev/null || true
          find ci-artifacts -type f -maxdepth 3 -print

      - name: Upload LSPosed APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsposed-debug-apks
          path: LSPosed-master/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish latest LSPosed APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lsposed-latest
          name: Latest LSPosed APK
          body: "Automated prerelease containing the latest successful LSPosed debug APK build."
          files: ci-artifacts/lsposed-release/lsposed-debug.apk
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload LSPosed zip artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsposed-zip-outputs
          path: ci-artifacts/lsposed-zips/*.zip
          if-no-files-found: ignore
