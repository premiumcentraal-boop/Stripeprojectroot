name: Build RootDeck APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating/updating a release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk rootdeck-debug.apk

      - name: Update 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest RootDeck Build
          body: "Automated build from GitHub Actions containing the latest RootDeck APK."
          files: rootdeck-debug.apk
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
