name: Build RootDeck APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-rootdeck-apk.yml'
      - 'build-rootdeck-apk.yml'
      - 'public/build-rootdeck-apk.yml'
      - 'public/downloads/build-rootdeck-apk.yml'

jobs:
  build-and-release:
    name: Build latest RootDeck APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify RootDeck Android project
        run: |
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          grep 'versionName = "0.30.0"' android/app/build.gradle.kts
          grep 'versionCode = 30' android/app/build.gradle.kts

      - name: Explain Gradle wrapper workaround
        run: |
          if [ -d android/gradlew ]; then
            echo "android/gradlew is a directory in this repo, so CI intentionally uses the system Gradle command."
          elif [ -f android/gradlew ]; then
            echo "android/gradlew exists as a file, but this workflow still uses system Gradle for consistency."
          else
            echo "No android/gradlew file found; using system Gradle."
          fi

      - name: Build Debug APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK version
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep "versionName='0.30.0'" apk-badging.txt
          grep "versionCode='30'" apk-badging.txt

      - name: Prepare release APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk rootdeck-debug.apk
          ls -lh rootdeck-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v5
        with:
          name: rootdeck-debug-apk-v0.30.0
          path: rootdeck-debug.apk
          if-no-files-found: error

      - name: Update stable RootDeck release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest RootDeck Build
          body: |
            Automated RootDeck APK build from GitHub Actions.

            Current expected app version: v0.30.0
            Android versionName: 0.30.0
            Android versionCode: 28

            Stable download URL:
            https://github.com/premiumcentraal-boop/Stripeprojectroot/releases/download/latest/rootdeck-debug.apk
          files: rootdeck-debug.apk
          prerelease: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
